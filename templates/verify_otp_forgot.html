<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - Capital College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
  <div class="w-full max-w-md p-8 space-y-6 border border-blue-200 rounded-xl shadow-lg">

    <!-- Logo -->
    <div class="flex justify-center">
      <img src="https://ik.imagekit.io/rkdq3vbqs/j3cu5h2a_400x400%20(2)-modified.png?updatedAt=1750592971414" 
           alt="Capital College Logo" class="w-24 h-24 rounded-full">
    </div>

    <!-- Heading -->
    <h2 class="text-center text-2xl font-bold text-blue-700">Verify Your Email</h2>
    <p class="text-center text-sm text-gray-500">
      Enter the 6-digit code sent to<br>
      <strong id="userEmail">{{ email or 'your email' }}</strong>
    </p>

    <!-- OTP Verification Form -->
    <form id="verifyOtpForm" class="space-y-4">
      <input type="hidden" id="email" value="{{ email }}">
      <div class="space-y-3">
        <label class="block text-sm font-medium text-gray-700">Verification Code</label>
        <div class="flex justify-between space-x-2" id="otpContainer">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="0">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="1">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="2">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="3">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="4">
          <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" data-index="5">
        </div>
        <input type="hidden" id="otpCode" name="otp">
        <div id="otpError" class="text-red-500 text-sm hidden"></div>

        <div class="flex justify-between items-center text-sm">
          <span id="timerText" class="text-gray-500">Resend code in <span id="countdown">60</span>s</span>
          <button type="button" id="resendBtn" class="text-blue-600 hover:text-blue-800 font-medium hidden">Resend Code</button>
        </div>
      </div>

      <button type="submit" id="verifyBtn"
              class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition duration-200 flex items-center justify-center">
        <span id="btnText">Verify Code</span>
        <div id="loadingSpinner" class="hidden ml-2">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
        </div>
      </button>
    </form>

    <div class="flex justify-center text-sm text-blue-600 mt-4">
      <a href="/profile/forgot-password-page" class="hover:underline">Back to Forgot Password</a>
    </div>
  </div>

<script>
let countdown = 60;
let countdownInterval;

// Get email from URL parameters
function getEmailFromURL() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('email');
}

// Start countdown timer
function startCountdown() {
  const countdownElement = document.getElementById('countdown');
  const resendBtn = document.getElementById('resendBtn');
  const timerText = document.getElementById('timerText');

  countdown = 60;
  countdownElement.textContent = countdown;
  resendBtn.classList.add('hidden');
  timerText.classList.remove('hidden');

  countdownInterval = setInterval(() => {
    countdown--;
    countdownElement.textContent = countdown;

    if (countdown <= 0) {
      clearInterval(countdownInterval);
      resendBtn.classList.remove('hidden');
      timerText.classList.add('hidden');
    }
  }, 1000);
}

// Handle OTP input
document.querySelectorAll('.otp-input').forEach((input, index, inputs) => {
  input.addEventListener('input', (e) => {
    const value = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = value;
    updateOtpCode();
    if (value && index < inputs.length - 1) inputs[index + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
  });
});

function updateOtpCode() {
  const otp = Array.from(document.querySelectorAll('.otp-input')).map(input => input.value).join('');
  document.getElementById('otpCode').value = otp;
}

// Resend OTP
document.getElementById('resendBtn').addEventListener('click', async function() {
  const email = document.getElementById('email').value;
  const resendBtn = this;
  resendBtn.disabled = true;
  resendBtn.textContent = 'Sending...';

  try {
    const response = await fetch('/profile/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email })
    });
    const data = await response.json();
    if (data.success) {
      await Swal.fire({ icon: 'success', title: 'Code Resent!', text: data.message, confirmButtonColor: '#3b82f6' });
      startCountdown();
    } else {
      await Swal.fire({ icon: 'error', title: 'Failed to Resend', text: data.message, confirmButtonColor: '#ef4444' });
    }
  } catch (error) {
    await Swal.fire({ icon: 'error', title: 'Network Error', text: 'Please check your connection and try again.', confirmButtonColor: '#ef4444' });
  } finally {
    resendBtn.disabled = false;
    resendBtn.textContent = 'Resend Code';
  }
});

// Verify OTP
document.getElementById('verifyOtpForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const otp = document.getElementById('otpCode').value;
  const email = document.getElementById('email').value;
  const verifyBtn = document.getElementById('verifyBtn');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const otpError = document.getElementById('otpError');

  otpError.classList.add('hidden');

  if (otp.length !== 6) {
    otpError.textContent = 'Please enter the complete 6-digit code.';
    otpError.classList.remove('hidden');
    return;
  }

  verifyBtn.disabled = true;
  btnText.textContent = 'Verifying...';
  loadingSpinner.classList.remove('hidden');

  try {
    const response = await fetch('/profile/forgot-password/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email, otp: otp })
    });
    const data = await response.json();

    if (data.success) {
      await Swal.fire({
        icon: 'success',
        title: 'Verified!',
        text: data.message,
        confirmButtonColor: '#3b82f6',
        confirmButtonText: 'Continue to Reset Password'
      });
      window.location.href = '/profile/forgot-password/reset-page?email=' + encodeURIComponent(email);
    } else {
      otpError.textContent = data.message;
      otpError.classList.remove('hidden');
    }

  } catch (error) {
    console.error('Error:', error);
    await Swal.fire({ icon: 'error', title: 'Network Error', text: 'Please check your connection and try again.', confirmButtonColor: '#ef4444' });
  } finally {
    verifyBtn.disabled = false;
    btnText.textContent = 'Verify Code';
    loadingSpinner.classList.add('hidden');
  }
});

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  const email = getEmailFromURL();
  if (email) {
    document.getElementById('email').value = email;
    document.getElementById('userEmail').textContent = email;
  }
  startCountdown();
});
</script>
</body>
</html>
