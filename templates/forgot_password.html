<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Capital College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
<div class="min-h-screen flex items-center justify-center bg-white">
  <div class="w-full max-w-md p-8 space-y-6 border border-blue-200 rounded-xl shadow-lg">
    
    <!-- Logo -->
    <div class="flex justify-center">
      <img src="https://ik.imagekit.io/rkdq3vbqs/j3cu5h2a_400x400%20(2)-modified.png?updatedAt=1750592971414" 
           alt="Capital College Logo" class="w-24 h-24 rounded-full">
    </div>

    <!-- Heading -->
    <h2 class="text-center text-2xl font-bold text-blue-700">Forgot Password</h2>
    <p class="text-center text-sm text-gray-500">Enter your email to receive a verification code</p>

    <!-- Forgot Password Form -->
    <form id="forgotPasswordForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        <div id="emailError" class="text-red-500 text-sm mt-1 hidden"></div>
      </div>

      <button type="submit" id="submitBtn"
              class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition duration-200 flex items-center justify-center">
        <span id="btnText">Send Verification Code</span>
        <div id="loadingSpinner" class="hidden ml-2">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
        </div>
      </button>
    </form>

    <!-- Links -->
    <div class="flex justify-center text-sm text-blue-600 mt-4">
      <a href="{{ url_for('auth.login') }}" class="hover:underline">Back to Login</a>
    </div>

  </div>
</div>

<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const emailError = document.getElementById('emailError');
  
  // Reset errors
  emailError.classList.add('hidden');
  
  // Validate email
  if (!email || !email.includes('@')) {
    emailError.textContent = 'Please enter a valid email address.';
    emailError.classList.remove('hidden');
    return;
  }
  
  // Show loading state
  submitBtn.disabled = true;
  btnText.textContent = 'Sending...';
  loadingSpinner.classList.remove('hidden');
  
  try {
    const response = await fetch('/profile/forgot-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email: email })
    });
    
    const data = await response.json();
    
    if (data.success) {
      // Show success message
      await Swal.fire({
        icon: 'success',
        title: 'Verification Code Sent!',
        text: data.message,
        confirmButtonColor: '#3b82f6',
        confirmButtonText: 'Continue to Verification'
      });
      
      // Redirect to OTP verification page
      window.location.href = '/profile/forgot-password/verify-page?email=' + encodeURIComponent(email);
      
    } else {
      // Show error message
      await Swal.fire({
        icon: 'error',
        title: 'Failed to Send Code',
        text: data.message,
        confirmButtonColor: '#ef4444'
      });
    }
    
  } catch (error) {
    console.error('Error:', error);
    await Swal.fire({
      icon: 'error',
      title: 'Network Error',
      text: 'Please check your connection and try again.',
      confirmButtonColor: '#ef4444'
    });
  } finally {
    // Reset button state
    submitBtn.disabled = false;
    btnText.textContent = 'Send Verification Code';
    loadingSpinner.classList.add('hidden');
  }
});

// Real-time email validation
document.getElementById('email').addEventListener('blur', function() {
  const email = this.value;
  const emailError = document.getElementById('emailError');
  
  if (email && !email.includes('@')) {
    emailError.textContent = 'Please enter a valid email address.';
    emailError.classList.remove('hidden');
  } else {
    emailError.classList.add('hidden');
  }
});
</script>
</body>
</html>
