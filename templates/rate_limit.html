{% extends "base.html" %}
{% block title %}Rate Limit Exceeded{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-2xl font-bold text-red-600">Too Many Requests</h1>
        <p class="text-gray-600 mt-2">Please wait a minute before trying again.</p>
        <a href="{{ url_for('auth.login') }}" class="mt-4 inline-block bg-blue-600 text-white px-4 py-2 rounded">Return to Login</a>
    </div>
</div>
{% endblock %}
