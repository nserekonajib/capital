<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Capital College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
<div class="min-h-screen flex items-center justify-center bg-white">
  <div class="w-full max-w-md p-8 space-y-6 border border-blue-200 rounded-xl shadow-lg">
    
    <!-- Logo -->
    <div class="flex justify-center">
      <img src="https://ik.imagekit.io/rkdq3vbqs/j3cu5h2a_400x400%20(2)-modified.png?updatedAt=1750592971414" 
           alt="Capital College Logo" class="w-24 h-24 rounded-full">
    </div>

    <!-- Heading -->
    <h2 class="text-center text-2xl font-bold text-blue-700">Reset Your Password</h2>
    <p class="text-center text-sm text-gray-500">Enter your new password below</p>

    <!-- Reset Password Form -->
    <form id="resetPasswordForm" class="space-y-4">
      <input type="hidden" id="email" value="{{ email }}">
      
      <div>
        <label class="block text-sm font-medium text-gray-700">New Password</label>
        <input type="password" name="new_password" id="newPassword" placeholder="Enter new password" required
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        <div id="passwordError" class="text-red-500 text-sm mt-1 hidden"></div>
        <div class="text-xs text-gray-500 mt-1">Password must be at least 8 characters long</div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm new password" required
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        <div id="confirmError" class="text-red-500 text-sm mt-1 hidden"></div>
      </div>

      <button type="submit" id="submitBtn"
              class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition duration-200 flex items-center justify-center">
        <span id="btnText">Reset Password</span>
        <div id="loadingSpinner" class="hidden ml-2">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
        </div>
      </button>
    </form>

    <!-- Links -->
    <div class="flex justify-center text-sm text-blue-600 mt-4">
      <a href="{{ url_for('auth.login') }}" class="hover:underline">Back to Login</a>
    </div>

  </div>
</div>

<script>
// Get email from URL parameters
function getEmailFromURL() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('email');
}

document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const email = document.getElementById('email').value;
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const passwordError = document.getElementById('passwordError');
  const confirmError = document.getElementById('confirmError');
  
  // Reset errors
  passwordError.classList.add('hidden');
  confirmError.classList.add('hidden');
  
  // Validate passwords
  let isValid = true;
  
  if (newPassword.length < 8) {
    passwordError.textContent = 'Password must be at least 8 characters long.';
    passwordError.classList.remove('hidden');
    isValid = false;
  }
  
  if (newPassword !== confirmPassword) {
    confirmError.textContent = 'Passwords do not match.';
    confirmError.classList.remove('hidden');
    isValid = false;
  }
  
  if (!isValid) return;
  
  // Show loading state
  submitBtn.disabled = true;
  btnText.textContent = 'Resetting...';
  loadingSpinner.classList.remove('hidden');
  
  try {
    const response = await fetch('/profile/forgot-password/reset', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ 
        new_password: newPassword,
        confirm_password: confirmPassword,
        email: email
      })
    });
    
    const data = await response.json();
    
    if (data.success) {
      await Swal.fire({
        icon: 'success',
        title: 'Password Reset!',
        text: data.message,
        confirmButtonColor: '#3b82f6',
        confirmButtonText: 'Go to Login'
      });
      
      // Redirect to login page
      window.location.href = "{{ url_for('auth.login') }}";
      
    } else {
      await Swal.fire({
        icon: 'error',
        title: 'Reset Failed',
        text: data.message,
        confirmButtonColor: '#ef4444'
      });
    }
    
  } catch (error) {
    console.error('Error:', error);
    await Swal.fire({
      icon: 'error',
      title: 'Network Error',
      text: 'Please check your connection and try again.',
      confirmButtonColor: '#ef4444'
    });
  } finally {
    // Reset button state
    submitBtn.disabled = false;
    btnText.textContent = 'Reset Password';
    loadingSpinner.classList.add('hidden');
  }
});

// Real-time password validation
document.getElementById('confirmPassword').addEventListener('input', function() {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = this.value;
  const confirmError = document.getElementById('confirmError');
  
  if (confirmPassword && newPassword !== confirmPassword) {
    confirmError.textContent = 'Passwords do not match.';
    confirmError.classList.remove('hidden');
  } else {
    confirmError.classList.add('hidden');
  }
});

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  const email = getEmailFromURL();
  if (email) {
    document.getElementById('email').value = email;
  }
});
</script>
</body>
</html>
