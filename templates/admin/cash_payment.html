{% extends "admin/base.html" %}
{% block title %}Admin Cash Payment{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl overflow-hidden mt-8 border border-gray-100">
    <!-- Header Section -->
    <div class="bg-blue-600 text-white px-6 py-4">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Record Cash Payment
            </h2>
            <a href="{{ url_for('admin_payments.admin_payments_dashboard') }}" 
               class="bg-white text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg font-medium transition duration-200 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Form Section -->
    <div class="p-6">
        <div class="space-y-6">
            <!-- Search Student -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Search Student</label>
                <div class="relative">
                    <input type="text" id="studentSearch" placeholder="Type student name..." 
                           class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute right-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <ul id="searchResults" class="border border-gray-300 rounded-lg mt-2 hidden bg-white shadow-lg max-h-60 overflow-y-auto z-10 absolute w-full"></ul>
            </div>

            <!-- Invoice Dropdown -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Select Invoice</label>
                <div class="relative">
                    <select id="invoiceSelect" class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none transition duration-200">
                        <option value="">Select a student first</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Amount (UGX)</label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-500">UGX</span>
                    <input type="number" id="amountInput" 
                           class="w-full border border-gray-300 pl-12 pr-4 py-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Submit Button -->
            <button id="payBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-medium transition duration-200 w-full flex items-center justify-center shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Process Payment
            </button>
        </div>
    </div>
</div>

<script>
let selectedStudent = null;

document.getElementById("studentSearch").addEventListener("input", async (e) => {
    const query = e.target.value.trim();
    const resultsBox = document.getElementById("searchResults");

    if (!query) {
        resultsBox.classList.add("hidden");
        resultsBox.innerHTML = "";
        return;
    }

    const res = await fetch(`/admin/search_students?q=${encodeURIComponent(query)}`);
    const json = await res.json();
    const students = json.data || [];

    resultsBox.innerHTML = students.map(s => 
        `<li class="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 transition duration-150" data-id="${s.id}">
            <div class="font-medium">${s.full_name}</div>
            <div class="text-sm text-gray-500">${s.cpa_level}</div>
        </li>`).join("");
    resultsBox.classList.remove("hidden");

    resultsBox.querySelectorAll("li").forEach(li => {
        li.addEventListener("click", async () => {
            selectedStudent = li.dataset.id;
            document.getElementById("studentSearch").value = li.querySelector('.font-medium').textContent;
            resultsBox.classList.add("hidden");

            // Load invoices
            const invRes = await fetch(`/admin/student_invoices/${selectedStudent}`);
            const jsonData = await invRes.json();
            const invoices = jsonData.data || [];
            
            const invoiceSelect = document.getElementById("invoiceSelect");
            invoiceSelect.innerHTML = invoices.length
                ? invoices.map(inv => `<option value="${inv.id}">${inv.invoice_number} — UGX ${inv.balance.toLocaleString()}</option>`).join("")
                : "<option>No unpaid invoices</option>";
        });
    });
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    if (!document.getElementById('studentSearch').contains(e.target) && 
        !document.getElementById('searchResults').contains(e.target)) {
        document.getElementById('searchResults').classList.add('hidden');
    }
});

document.getElementById("payBtn").addEventListener("click", async () => {
    const invoiceId = document.getElementById("invoiceSelect").value;
    const amount = document.getElementById("amountInput").value;

    if (!selectedStudent || !invoiceId || !amount) {
        alert("Please complete all fields.");
        return;
    }

    const res = await fetch("/admin/payments/cash/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: selectedStudent, invoice_id: invoiceId, amount })
    });

    const data = await res.json();
    
    // Show a styled alert instead of default browser alert
    const alertDiv = document.createElement('div');
    alertDiv.className = data.success 
        ? 'fixed top-4 right-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded shadow-lg z-50'
        : 'fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded shadow-lg z-50';
    alertDiv.innerHTML = `
        <div class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${data.success ? 'M5 13l4 4L19 7' : 'M6 18L18 6M6 6l12 12'}" />
            </svg>
            <span>${data.message}</span>
        </div>
    `;
    document.body.appendChild(alertDiv);
    
    setTimeout(() => {
        alertDiv.remove();
        if (data.success) location.reload();
    }, 3000);
});
</script>

<style>
/* Custom scrollbar for dropdown */
#searchResults::-webkit-scrollbar {
    width: 6px;
}

#searchResults::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 0 0 8px 0;
}

#searchResults::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 3px;
}

#searchResults::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
}
</style>
{% endblock %}
