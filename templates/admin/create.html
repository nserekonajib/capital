{% extends "admin/base.html" %}
{% block content %}
<div class="bg-white shadow-lg rounded-lg p-8 max-w-lg mx-auto">
  <h2 class="text-2xl font-bold text-blue-600 mb-6">Create New Admin</h2>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block mb-1 text-gray-700">Email</label>
      <input type="email" name="email" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
    </div>

    <div>
      <label class="block mb-1 text-gray-700">Password</label>
      <input type="password" name="password" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
    </div>

    <div>
      <label class="block mb-1 text-gray-700">Role</label>
      <select name="role" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <option value="viewer">Viewer</option>
        <option value="manager">Manager</option>
        <option value="superadmin">Superadmin</option>
      </select>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
      Create Admin
    </button>
  </form>
</div>
{% endblock %}
